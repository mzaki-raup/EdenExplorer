name: Release

# Pushing to main releases automatically. The commits since the last v* tag
# decide the version (scripts/next-release.ps1): an "Add ..." subject is a minor
# bump, "Fix ..." and most other verbs a patch, a BREAKING CHANGE footer a major,
# and a push with nothing release-worthy in it (docs, chores, refactors) simply
# publishes nothing and stops.
#
# What a release publishes - the app's update check reads these exact names, so
# they are a contract:
#
#   EdenExplorer.exe                         the program, downloaded in place
#   SHA256SUMS.txt                           checked before anything is replaced
#   EdenExplorer-<version>-windows-x64.zip   for people who update by hand
#
# Never publish the program without SHA256SUMS.txt beside it: an updater has
# nothing to verify the download against and must refuse to install it.
#
# As in ci.yml, nothing here uses a published action - this instance cannot fetch
# them from code.forgejo.org (forgejo#2809).
on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

env:
  # The forge decides who a release is "from" by matching the tag's own author
  # email to an account - a tag made with an email no account owns is published
  # by "Ghost". This is the email on the account that owns this repository.
  TAGGER_NAME: EdenExplorer Release
  TAGGER_EMAIL: owner@zacx.net

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out main, with the history and tags the version needs
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Get-ChildItem -Force . | Remove-Item -Recurse -Force
          git init --quiet --initial-branch=release .
          git remote add origin "${{ github.server_url }}/${{ github.repository }}.git"
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          $auth = "http.extraheader=Authorization: Basic $basic"
          # Not shallow, and with every tag: the version and the notes are both
          # worked out from the commits since the last tag.
          git -c $auth fetch --quiet --tags origin
          git checkout --quiet --detach ${{ github.sha }}
          git log --oneline -1

      - name: Work out the version to release
        id: plan
        run: pwsh -NoProfile -File scripts/next-release.ps1

      - name: Use the latest stable Rust
        if: steps.plan.outputs.version != ''
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy
          rustc --version

      # Advisory for the same reason as in ci.yml - see the note there.
      - name: Formatting (advisory)
        if: steps.plan.outputs.version != ''
        run: |
          cargo fmt --all --check
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::cargo fmt --check reports formatting differences."
          }
          exit 0

      - name: Tests
        if: steps.plan.outputs.version != ''
        run: cargo test --locked

      - name: Clippy
        if: steps.plan.outputs.version != ''
        run: cargo clippy --release --all-targets --locked

      # Before the build, so the binary carries the released version: the app
      # compares a release's tag against its own CARGO_PKG_VERSION, and a
      # mismatch would offer the same update for ever.
      - name: Set the version, then commit and tag it locally
        if: steps.plan.outputs.version != ''
        run: |
          pwsh -NoProfile -File scripts/update-version.ps1 -Version ${{ steps.plan.outputs.version }}
          git config user.name "$env:TAGGER_NAME"
          git config user.email "$env:TAGGER_EMAIL"
          git add Cargo.toml Cargo.lock
          # [skip ci] so pushing this back to main does not start another release.
          git commit --quiet -m "chore(release): ${{ steps.plan.outputs.version }} [skip ci]"
          # Annotated, and on the bumped commit, so the tag and the Cargo.toml
          # at that tag always agree. Nothing is pushed until the build succeeds.
          git tag -a ${{ steps.plan.outputs.tag }} -m "${{ steps.plan.outputs.tag }}"
          git log --oneline -1

      - name: Build and package
        if: steps.plan.outputs.version != ''
        run: pwsh -NoProfile -File scripts/build-and-package.ps1 -Version ${{ steps.plan.outputs.version }}

      - name: Push the version commit and the tag
        if: steps.plan.outputs.version != ''
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          $auth = "http.extraheader=Authorization: Basic $basic"
          git -c $auth push --quiet origin HEAD:main
          git -c $auth push --quiet origin ${{ steps.plan.outputs.tag }}
          Write-Host "Pushed ${{ steps.plan.outputs.tag }} and the version commit to main."

      - name: Publish the release
        if: steps.plan.outputs.version != ''
        env:
          # Forgejo hands the workflow a token with write access to this
          # repository; the API below is their /api/v1, not GitHub's.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Without this a non-terminating error carries on: `Get-ChildItem`
          # over a missing release/dist writes an error, the upload loop then
          # iterates over nothing, and the job goes green having attached no
          # program at all. That is exactly how v1.4.2 published with only its
          # zip and v1.5.0 with no assets whatsoever, leaving every user stuck
          # on v1.4.1 - the app passes over a release with no EdenExplorer.exe,
          # so both simply read as "you are running the latest".
          $ErrorActionPreference = "Stop"

          $api = "${{ github.server_url }}/api/v1/repos/${{ github.repository }}"
          $headers = @{ Authorization = "token $env:TOKEN" }
          $tag = "${{ steps.plan.outputs.tag }}"

          # The notes are the whole point of a release page, and an empty one
          # published silently is exactly what happened on v1.0.0 - so refuse
          # rather than ship another.
          if (-not (Test-Path notes.md)) {
            throw "notes.md is missing - scripts/next-release.ps1 should have written it."
          }
          $notes = Get-Content notes.md -Raw
          if ([string]::IsNullOrWhiteSpace($notes)) { throw "notes.md is empty." }

          $payload = @{
            tag_name   = $tag
            name       = "EdenExplorer ${{ steps.plan.outputs.version }}"
            body       = $notes
            draft      = $false
            prerelease = $false
          } | ConvertTo-Json -Depth 4

          # The forge derives a release row from the pushed tag by itself -
          # every release so far has a created_at equal to its tag's commit
          # time, including ones this step then corrected successfully. That
          # derivation is asynchronous, so a PATCH can land *before* it and get
          # clobbered: v1.0.1 came out right and v1.0.2 came out with the tag's
          # own name and no body, from byte-identical workflow code. So the
          # metadata is applied last, after the assets, and then confirmed in a
          # loop rather than once.
          $release = $null
          try {
            $release = Invoke-RestMethod -Method Get -Headers $headers `
              -Uri "$api/releases/tags/$([uri]::EscapeDataString($tag))"
          } catch { }
          if (-not $release) {
            $release = Invoke-RestMethod -Method Post -Uri "$api/releases" `
              -Headers $headers -ContentType 'application/json' -Body $payload
            Write-Host "Created release $($release.id)"
          } else {
            Write-Host "The forge already has a release for $tag (id $($release.id))"
          }

          # The app downloads these two by name and refuses a release it
          # cannot check, so a release without them is worse than no release:
          # it looks published and can never be installed.
          $dist = "release/dist"
          $required = @("EdenExplorer.exe", "SHA256SUMS.txt")
          if (-not (Test-Path $dist)) {
            throw "$dist is missing - scripts/build-and-package.ps1 should have written it."
          }
          $staged = @(Get-ChildItem $dist -File)
          Write-Host "Staged for upload: $($staged.Count) file(s)"
          $staged | ForEach-Object { Write-Host ("  {0,-46} {1,12:N0} bytes" -f $_.Name, $_.Length) }
          foreach ($name in $required) {
            if (-not ($staged | Where-Object { $_.Name -eq $name })) {
              throw "$name is not in $dist - refusing to publish a release the app cannot install."
            }
          }

          foreach ($file in $staged) {
            # A re-run must not end up with the same asset attached twice.
            $existing = Invoke-RestMethod -Method Get -Headers $headers -Uri "$api/releases/$($release.id)"
            foreach ($old in @($existing.assets | Where-Object { $_.name -eq $file.Name })) {
              Invoke-RestMethod -Method Delete -Headers $headers `
                -Uri "$api/releases/$($release.id)/assets/$($old.id)" | Out-Null
              Write-Host "Replaced the existing $($file.Name)"
            }
            $uri = "$api/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($file.Name))"
            # Deliberately not fatal. A big asset can come back 524 (a proxy
            # timeout) having uploaded anyway, and $ErrorActionPreference =
            # "Stop" would end the script here - which is exactly how v1.11.1
            # published with only its zip, skipping the verify-and-re-upload
            # loop below that exists for this. Let the verification decide
            # what actually landed.
            try {
              Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Form @{ attachment = Get-Item $file.FullName } | Out-Null
              Write-Host "Attached $($file.Name)"
            } catch {
              Write-Host "Upload of $($file.Name) reported '$($_.Exception.Message)' - the check below decides."
            }
          }

          # Uploading is not the same as having uploaded. The title and notes
          # below have been confirmed by reading them back ever since v1.0.2
          # came out empty; the assets were still fire-and-forget, which is
          # the other half of that same lesson and the reason this went
          # unnoticed for two releases.
          # Every staged file, not just $required: a 524 on the zip is just
          # as likely as one on the exe (v1.12.0 got both), and checking only
          # the required pair meant the zip's failure was swallowed in
          # silence - worse than the loud failure it replaced.
          $wantedAssets = @($staged | ForEach-Object { $_.Name })
          foreach ($attempt in 1..5) {
            $check = Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)" -Headers $headers
            $have = @($check.assets | ForEach-Object { $_.name })
            $missing = @($wantedAssets | Where-Object { $have -notcontains $_ })
            if ($missing.Count -eq 0) {
              Write-Host "Confirmed on the release: $($have -join ', ')"
              break
            }
            Write-Host "Attempt ${attempt}: still missing $($missing -join ', ') - re-uploading."
            foreach ($name in $missing) {
              $file = $staged | Where-Object { $_.Name -eq $name } | Select-Object -First 1
              $uri = "$api/releases/$($release.id)/assets?name=$([uri]::EscapeDataString($name))"
              # Same reasoning as the first loop: a throw here would defeat
              # the retry this loop is.
              try {
                Invoke-RestMethod -Method Post -Uri $uri -Headers $headers -Form @{ attachment = Get-Item $file.FullName } | Out-Null
              } catch {
                Write-Host "Re-upload of $name reported '$($_.Exception.Message)'."
              }
            }
            Start-Sleep -Seconds 15
          }
          $check = Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)" -Headers $headers
          $have = @($check.assets | ForEach-Object { $_.name })
          # Only the updater's own two are fatal - it is what the app needs to
          # install at all. The zip is a convenience, so a missing one is
          # shouted about rather than failing a release that otherwise works.
          $missing = @($required | Where-Object { $have -notcontains $_ })
          if ($missing.Count -gt 0) {
            throw "the release is missing $($missing -join ', ') after re-uploading - users could never install it."
          }
          $alsoMissing = @($wantedAssets | Where-Object { $have -notcontains $_ })
          if ($alsoMissing.Count -gt 0) {
            Write-Host "::warning::published without $($alsoMissing -join ', ') - attach by hand."
          }

          # Now make the title and notes stick, re-checking after a pause so a
          # late derivation that overwrites them is caught and undone.
          $wanted = "EdenExplorer ${{ steps.plan.outputs.version }}"
          $ok = $false
          foreach ($attempt in 1..6) {
            Invoke-RestMethod -Method Patch -Uri "$api/releases/$($release.id)" `
              -Headers $headers -ContentType 'application/json' -Body $payload | Out-Null
            Start-Sleep -Seconds 5
            $check = Invoke-RestMethod -Method Get -Uri "$api/releases/$($release.id)" -Headers $headers
            if ($check.name -eq $wanted -and -not [string]::IsNullOrWhiteSpace($check.body)) {
              Write-Host "Attempt ${attempt}: title and $($check.body.Length) characters of notes are in place."
              $ok = $true
              break
            }
            Write-Host "Attempt ${attempt}: still name='$($check.name)' body=$($check.body.Length) chars - retrying."
          }
          if (-not $ok) {
            throw "could not make the release title and notes stick - the forge keeps overwriting them."
          }
          Write-Host "Release '$wanted' published at $($release.html_url)"

      - name: Nothing to release
        if: steps.plan.outputs.version == ''
        run: Write-Host "No release-worthy commits since the last tag - published nothing."
